<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SupplyChainIQ — Fashion Commerce Supply Chain Intelligence</title>
    <meta name="description" content="Fashion commerce supply chain intelligence: inventory health, fulfillment and delivery risk, and one-click replenishment decisions." />

    <!-- Favicons — the SupplyChainIQ brand tile -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Browser chrome tinting: the tab strip, address bar, and OS surfaces pick up the brand blue -->
    <meta name="theme-color" content="#2563eb" />
    <meta name="msapplication-TileColor" content="#2563eb" />

    <!-- Open Graph / Twitter — the identity carries into link previews -->
    <meta property="og:title" content="SupplyChainIQ — Fashion Commerce Supply Chain Intelligence" />
    <meta property="og:description" content="From demand data to decisions: inventory, fulfillment, delivery, and customer-impact risks in one command center." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />

    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      // Apply the saved theme before first paint (default: light).
      try {
        var t = localStorage.getItem("scq_theme");
        document.documentElement.dataset.theme = t === "dark" ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
